[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-latency-beacon"
version = "1.0.0"
description = "A terminal dashboard for HTTP availability and response latency."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "rich>=13.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uptime_latency_beacon*"]
